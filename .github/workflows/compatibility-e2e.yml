name: Canonical compatibility E2E

on:
  workflow_dispatch:
  schedule:
    - cron: '17 7 * * *'

jobs:
  canonical:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: qvi-workflow/sig_ts_wallets/package-lock.json
      - name: Install TypeScript dependencies
        working-directory: qvi-workflow/sig_ts_wallets
        run: npm ci
      - name: Run canonical workflow
        working-directory: qvi-workflow/keria_docker
        run: timeout 1800 ./vlei-workflow.sh --timeout 300 --keep-runtime
      - name: Capture Compose evidence
        if: always()
        working-directory: qvi-workflow/keria_docker
        run: |
          mkdir -p runtime/evidence
          docker compose --env-file keria-signify-docker.env -f docker-compose-keria_signify_qvi.yaml ps -a > runtime/evidence/compose-ps.txt
          docker compose --env-file keria-signify-docker.env -f docker-compose-keria_signify_qvi.yaml logs --no-color > runtime/evidence/compose.log 2>&1 || true
          docker compose --env-file keria-signify-docker.env -f docker-compose-keria_signify_qvi.yaml images --format json > runtime/evidence/images.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canonical-compatibility-evidence
          path: qvi-workflow/keria_docker/runtime
          if-no-files-found: warn
      - name: Tear down
        if: always()
        working-directory: qvi-workflow/keria_docker
        run: >-
          docker compose
          --env-file keria-signify-docker.env
          -f docker-compose-keria_signify_qvi.yaml
          down -v --remove-orphans
