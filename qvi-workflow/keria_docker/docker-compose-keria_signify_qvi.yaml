# vLEI full chain Docker Compose file with all needed services
# - demo witnesses configured to use host.docker.internal
# - keria configured to use the demo witnesses
# - vLEI server for credential schema caching

x-keri_1_1-image: &keri_1_1-image
  image: weboftrust/keri:1.1.32

# Witness Images
x-gar-witness-image: &gar-witness-image
  image: gleif/keri:1.2.9
x-qar-witness-image: &qar-witness-image
  image: gleif/keri:1.2.9
x-person-witness-image: &person-witness-image
  image: gleif/keri:1.2.9

x-keria-image: &keria-image
  image: weboftrust/keria:0.4.0
x-vlei-image: &vlei-image
  image: gleif/vlei:1.0.0
x-direct-sally-image: &direct-sally-image
  image: gleif/sally:1.0.2

x-healthcheck: &healthcheck
  interval: 3s
  timeout: 3s
  retries: 10
  start_period: 20s
x-witness-env: &witness-env
  PYTHONUNBUFFERED: 1 # Ensure output is logged in real-time
  PYTHONIOENCODING: UTF-8 # Ensure consistent logging encoding
  PYTHONWARNINGS: ignore::SyntaxWarning # Ignore regular expression syntax warning

volumes:
  gar-wit-vol:
  qar-wit-vol:
  person-wit-vol:
  direct-sally-vol:
  keria1-vol:
  keria2-vol:
  keria3-vol:
  keria4-vol:

services:
  # vLEI schema caching server
  vlei-server:
    stop_grace_period: 1s
    <<: *vlei-image
    environment:
      - PYTHONUNBUFFERED=1 # Ensure output is logged in real-time
      - PYTHONIOENCODING=UTF-8 # Ensure consistent logging encoding
      - PYTHONWARNINGS=ignore::SyntaxWarning
    command: [ 'vLEI-server', "-s", "/vLEI/schema", "-c", "/vLEI/credentials", "-o", "/vLEI/oobis" ]
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://127.0.0.1:7723/oobi/EBfdlu8R27Fbx-ehrqwImnK-8Cm79sqbAQ4MmvEAYqao" ]
      <<: *healthcheck

  # GARs use one of the six demo witnesses, wan
  gar-witnesses:
    stop_grace_period: 1s
    <<: *gar-witness-image
    environment:
      <<: *witness-env
    healthcheck:
      # healthcheck needs to be different in 1.2.7+ because it uses the Alpine base image and curl is not present
      test: [ "CMD", "wget", "--spider", "--tries=1", "--no-verbose", "http://127.0.0.1:5642/oobi" ]
      <<: *healthcheck
    command: witness demo --loglevel INFO
    volumes:
      - ./runtime/config/witnesses-gar:/keripy/scripts/keri/cf/main
      - gar-wit-vol:/usr/local/var/keri
    depends_on:
      vlei-server:
        condition: service_healthy

  # GARs use one of the six demo witnesses, wan
  qar-witnesses:
    stop_grace_period: 1s
    <<: *qar-witness-image
    environment:
      <<: *witness-env
    healthcheck:
      test: [ "CMD", "wget", "--spider", "--tries=1", "--no-verbose", "http://127.0.0.1:5643/oobi" ]
      <<: *healthcheck
    command: witness demo --loglevel INFO
    volumes:
      - ./runtime/config/witnesses-qar:/keripy/scripts/keri/cf/main
      - qar-wit-vol:/usr/local/var/keri
    depends_on:
      vlei-server:
        condition: service_healthy

  # GARs use one of the six demo witnesses, wan
  person-witnesses:
    stop_grace_period: 1s
    <<: *person-witness-image
    environment:
      <<: *witness-env
    healthcheck:
      test: [ "CMD", "wget", "--spider", "--tries=1", "--no-verbose", "http://127.0.0.1:5644/oobi" ]
      <<: *healthcheck
    command: witness demo --loglevel INFO
    volumes:
      - ./runtime/config/witnesses-person:/keripy/scripts/keri/cf/main
      - person-wit-vol:/usr/local/var/keri
    depends_on:
      vlei-server:
        condition: service_healthy

  keria1:
    stop_grace_period: 1s
    <<: *keria-image
    environment:
      - KERI_AGENT_CORS=True # Enable CORS for the KERI agent
      - PYTHONUNBUFFERED=1 # Ensure output is logged in real-time
      - PYTHONIOENCODING=UTF-8 # Ensure consistent logging encoding
      - PYTHONWARNINGS=ignore::SyntaxWarning
      - KERIA_RELEASER_TIMEOUT=3600
    volumes:
      - ./runtime/config/keria/keria1.json:/keria/config/keri/cf/keria.json
      - keria1-vol:/usr/local/var/keri
    healthcheck:
      test: [ "CMD", "wget", "--spider", "--tries=1", "--no-verbose", "http://127.0.0.1:3902/spec.yaml" ]
      <<: *healthcheck
    entrypoint: [ 'keria', 'start', '--config-dir', '/keria/config', '--config-file', 'keria', '--name', 'keria', '--loglevel', 'INFO' ]
    depends_on:
      vlei-server:
        condition: service_healthy
      qar-witnesses:
        condition: service_healthy
      person-witnesses:
        condition: service_healthy

  keria2:
    stop_grace_period: 1s
    <<: *keria-image
    environment:
      - KERI_AGENT_CORS=True # Enable CORS for the KERI agent
      - PYTHONUNBUFFERED=1 # Ensure output is logged in real-time
      - PYTHONIOENCODING=UTF-8 # Ensure consistent logging encoding
      - PYTHONWARNINGS=ignore::SyntaxWarning
      - KERIA_RELEASER_TIMEOUT=3600
    volumes:
      - ./runtime/config/keria/keria2.json:/keria/config/keri/cf/keria.json
      - keria2-vol:/usr/local/var/keri
    healthcheck:
      test: [ "CMD", "wget", "--spider", "--tries=1", "--no-verbose", "http://127.0.0.1:3902/spec.yaml" ]
      <<: *healthcheck
    entrypoint: [ 'keria', 'start', '--config-dir', '/keria/config', '--config-file', 'keria', '--name', 'keria', '--loglevel', 'INFO' ]
    depends_on:
      vlei-server:
        condition: service_healthy
      qar-witnesses:
        condition: service_healthy
      person-witnesses:
        condition: service_healthy

  keria3:
    stop_grace_period: 1s
    <<: *keria-image
    environment:
      - KERI_AGENT_CORS=True # Enable CORS for the KERI agent
      - PYTHONUNBUFFERED=1 # Ensure output is logged in real-time
      - PYTHONIOENCODING=UTF-8 # Ensure consistent logging encoding
      - PYTHONWARNINGS=ignore::SyntaxWarning
      - KERIA_RELEASER_TIMEOUT=3600
    volumes:
      - ./runtime/config/keria/keria3.json:/keria/config/keri/cf/keria.json
      - keria3-vol:/usr/local/var/keri
    healthcheck:
      test: [ "CMD", "wget", "--spider", "--tries=1", "--no-verbose", "http://127.0.0.1:3902/spec.yaml" ]
      <<: *healthcheck
    entrypoint: [ 'keria', 'start', '--config-dir', '/keria/config', '--config-file', 'keria', '--name', 'keria', '--loglevel', 'INFO' ]
    depends_on:
      vlei-server:
        condition: service_healthy
      qar-witnesses:
        condition: service_healthy
      person-witnesses:
        condition: service_healthy

  keria4:
    stop_grace_period: 1s
    <<: *keria-image
    environment:
      - KERI_AGENT_CORS=True
      - PYTHONUNBUFFERED=1
      - PYTHONIOENCODING=UTF-8
      - PYTHONWARNINGS=ignore::SyntaxWarning
      - KERIA_RELEASER_TIMEOUT=3600
    volumes:
      - ./runtime/config/keria/keria4.json:/keria/config/keri/cf/keria.json
      - keria4-vol:/usr/local/var/keri
    healthcheck:
      test: [ "CMD", "wget", "--spider", "--tries=1", "--no-verbose", "http://127.0.0.1:3902/spec.yaml" ]
      <<: *healthcheck
    entrypoint: [ 'keria', 'start', '--config-dir', '/keria/config', '--config-file', 'keria', '--name', 'keria', '--loglevel', 'INFO' ]
    depends_on:
      vlei-server:
        condition: service_healthy
      qar-witnesses:
        condition: service_healthy
      person-witnesses:
        condition: service_healthy

  # Small source-owned recorder for the callbacks emitted by Sally.
  callback-recorder:
    stop_grace_period: 1s
    image: qvi-workflow-callback-recorder:local
    build:
      context: ./callback_recorder
    environment:
      PYTHONUNBUFFERED: "1"
      QVI_CALLBACKS_PATH: /runtime/sally-callbacks.jsonl
    volumes:
      - ./runtime:/runtime
    healthcheck:
      test: [ "CMD", "wget", "--spider", "--tries=1", "--no-verbose", "http://127.0.0.1:9923/health" ]
      <<: *healthcheck
    
  # Direct mode Sally Verifier (runs own mailbox, no witnesses or witness mailbox)
  direct-sally:
    stop_grace_period: 1s
    <<: *direct-sally-image
    environment:
      - PYTHONUNBUFFERED=1 # Ensure output is logged in real-time
      - PYTHONIOENCODING=UTF-8 # Ensure consistent logging encoding
      - SALLY_KS_NAME=${DIRECT_SALLY_KS_NAME}
      - SALLY_ALIAS=${DIRECT_SALLY_ALIAS}
      - SALLY_SALT=${DIRECT_SALLY_SALT}
      - SALLY_PASSCODE=${DIRECT_SALLY_PASSCODE}
      - WEBHOOK_HOST=${WEBHOOK_HOST}
      - GEDA_PRE=${GEDA_PRE:-}
      - PYTHONWARNINGS=ignore::SyntaxWarning
      - SALLY_PORT=9823
    volumes:
      - ./runtime/config/direct-sally/keri/cf/direct-sally.json:/sally/conf/keri/cf/direct-sally.json
      - ./runtime/config/direct-sally/sally-incept-no-wits.json:/sally/conf/sally-incept-no-wits.json:ro
      - ./direct-sally/entry-point.sh:/sally/entry-point.sh:ro
      - direct-sally-vol:/usr/local/var/keri
    healthcheck:
      test: [ "CMD", "wget", "--spider", "--tries=1", "--no-verbose", "http://127.0.0.1:9823/health" ]
      <<: *healthcheck
    entrypoint: "/sally/entry-point.sh"
    depends_on:
      callback-recorder:
        condition: service_healthy
      vlei-server:
        condition: service_healthy

  # Compose-scoped one-shot services used by the workflow driver.
  kli:
    <<: *keri_1_1-image
    profiles: [ "jobs" ]
    entrypoint: kli
    environment:
      PYTHONWARNINGS: ignore::SyntaxWarning
    volumes:
      - ./runtime/keystores:/usr/local/var/keri
      - ./runtime/config:/config
      - ./runtime/acdc-info:/acdc-info

  signify:
    image: gleif/vlei-workflow-signify:1.0.0
    build:
      context: ../sig_ts_wallets
      dockerfile: signify-ts.Dockerfile
    profiles: [ "jobs" ]
    entrypoint: tsx
    environment:
      QVI_OPERATION_TIMEOUT_SECONDS: ${WORKFLOW_TIMEOUT_SECONDS:-120}
    volumes:
      - ./runtime/config/participants.json:/vlei-workflow/participants.json:ro
      - ./runtime/qvi_data:/vlei-workflow/qvi_data
      - ./runtime/acdc-info:/acdc-info
